name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-platforms:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: ['LogBird', 'LogBirdUI']
        destination:
          - 'generic/platform=iOS'
          - 'generic/platform=tvOS'
          - 'generic/platform=watchOS'
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.scheme }} for ${{ matrix.destination }}
        run: xcodebuild -scheme ${{ matrix.scheme }} -destination '${{ matrix.destination }}' build CODE_SIGNING_ALLOWED=NO
